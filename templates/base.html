<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Classroom Progress Insights{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: #ffffff;
            color: #1f2937;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px;
        }
        .topbar .brand { font-size: 14px; font-weight: 600; color: #1f2937; }
        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 48px;
        }
        .card {
            background: #fff;
            border: 1.5px solid #000;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .center-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn {
            font-size: 14px;
            font-weight: 500;
            border: 0.5px solid #000;
            border-radius: 8px;
            padding: 10px 16px;
            background: #fff;
            cursor: pointer;
        }
        .btn:hover { background: #f5f5f5; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="topbar">
        <span class="brand">Classroom Progress Insights</span>
    </div>
    <div class="page">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
