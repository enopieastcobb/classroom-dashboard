{% extends "base.html" %}
{% block content %}
<div class="center-page">
    <div class="card" style="max-width:380px; width:100%; text-align:center;">
        <h1 style="font-size:18px; margin:0 0 4px;">Classroom Progress Insights</h1>
        <p style="font-size:13px; color:#6b7280; margin:0 0 20px;">
            Sign in with your Google Workspace account to view your class dashboard.
        </p>

        <div id="g_id_onload"
             data-client_id="{{ google_client_id }}"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-size="large"
             style="display:flex; justify-content:center;"></div>

        <form id="loginForm" method="POST" action="/dashboard" style="display:none;">
            <input type="hidden" name="credential" id="credentialInput">
            <input type="hidden" name="courseId" value="{{ courseId or '' }}">
            <input type="hidden" name="addOnToken" value="{{ addOnToken or '' }}">
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://accounts.google.com/gsi/client" async defer nonce="{{ nonce }}"></script>
<script nonce="{{ nonce }}">
    function handleCredentialResponse(response) {
        document.getElementById('credentialInput').value = response.credential;
        document.getElementById('loginForm').submit();
    }
</script>
{% endblock %}
